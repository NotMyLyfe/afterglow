[package]
name = "afterglow"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
pgwire = "0.40"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "std",
    "registry",
    "env-filter",
    "fmt",
] }
futures = "0.3"

[[bin]]
name = "afterglow"
path = "src/main.rs"
