services:
  primary:
    image: postgres:17
    container_name: pg_primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - listen_addresses=*
    volumes:
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - primary_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  replica:
    image: postgres:17
    container_name: pg_replica
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - ./postgres/init-replica.sh:/init-replica.sh:ro
      - replica_data:/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/init-replica.sh"]
    ports:
      - "5433:5432"

volumes:
  primary_data:
  replica_data:
